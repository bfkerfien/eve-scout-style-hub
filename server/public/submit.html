<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Eden Hub — Submit Intel</title><link rel="stylesheet" href="/style.css"></head><body><header class="top"><div class="brand"><div class="mark">◈</div><div><strong>NEW EDEN HUB</strong><span>CONNECTION INTELLIGENCE</span></div></div><nav><a href="/">Connections</a><a class="active" href="/submit.html">Submit Intel</a></nav><div class="live"><i></i> INTAKE ONLINE</div></header><main class="shell narrow"><section class="hero compact"><div><p class="eyebrow">SCOUT REPORTING</p><h1>Submit a new connection.</h1><p class="sub">Enter what your scout sees. The report is stored locally in this Docker instance and immediately appears on the connections board.</p></div></section><form id="form" class="card"><div class="grid"><label>From system *<input name="from_system" required placeholder="Thera"></label><label>To system *<input name="to_system" required placeholder="Jita"></label><label>From region<input name="from_region" placeholder="Thera"></label><label>To region<input name="to_region" placeholder="The Forge"></label><label>Jumps<input name="jumps" type="number" min="0" value="0"></label><label>Signature *<input name="signature" required placeholder="K162"></label><label>Type<select name="type"><option>Wormhole</option><option>Stargate</option><option>Filament</option></select></label><label>Ship size<select name="size"><option>Large</option><option>Medium</option><option>Small</option><option>Frigate</option></select></label><label>Lifetime<select name="lifetime"><option>Fresh</option><option>Stable</option><option>EOL</option></select></label><label>Scout / callsign<input name="pilot" placeholder="Scout Alpha"></label></div><label>Notes<textarea name="notes" placeholder="Traffic, mass status, observations…"></textarea></label><div class="actions"><a href="/">Cancel</a><button type="submit">PUBLISH CONNECTION</button></div><div id="msg"></div></form></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/connections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();const m=document.getElementById('msg');if(r.ok){m.className='ok';m.textContent='Connection published. Returning to board…';setTimeout(()=>location.href='/',700)}else{m.className='err';m.textContent=j.error||'Unable to save report.'}})</script></body></html>
